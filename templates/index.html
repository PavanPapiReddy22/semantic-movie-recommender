<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Movie Search</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search for a movie...">
    </div>
    <div id="posterGrid" class="poster-grid"></div>

    <script>
        let timeout = null;
        const searchBox = document.getElementById("searchBox");

        searchBox.addEventListener("input", () => {
            clearTimeout(timeout);
            const query = searchBox.value;
            if (query.length < 2) {
                document.getElementById("posterGrid").innerHTML = "";
                return;
            }

            timeout = setTimeout(() => {
                fetch(`/search?q=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        const posters = data.results || [];
                        const uniquePosters = [];

                        const seen = new Set();
                        for (const poster of posters) {
                            if (!seen.has(poster.title) && uniquePosters.length < 40) {
                                seen.add(poster.title);
                                uniquePosters.push(poster);
                            }
                        }

                        const grid = document.getElementById("posterGrid");
                        grid.innerHTML = "";

                        uniquePosters.forEach(movie => {
                            const div = document.createElement("div");
                            div.className = "poster-card";
                            div.innerHTML = `
                                <img src="${movie.poster}" alt="${movie.title}" title="${movie.title}" onclick="window.open('${movie.url}', '_blank')">
                            `;
                            grid.appendChild(div);
                        });
                    });
            }, 300);
        });
    </script>
</body>
</html>
